name: Build executables

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: MR_DDS_fixer-windows.exe
            executable: MR_DDS_fixer.exe

          - os: ubuntu-latest
            artifact: MR_DDS_fixer-linux
            executable: MR_DDS_fixer

          - os: macos-latest
            artifact: MR_DDS_fixer-macos
            executable: MR_DDS_fixer

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Build executable
        run: |
          pyinstaller \
            --onefile \
            --name "${{ matrix.executable }}" \
            MR_DDS_fixer.py

      - name: Rename executable
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv "dist/${{ matrix.executable }}" "dist/${{ matrix.artifact }}"
          else
            mv "dist/${{ matrix.executable }}" "dist/${{ matrix.artifact }}"
          fi

      - name: Upload executable to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact }}
