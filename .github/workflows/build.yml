name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: windows-latest
            executable: MR_DDS_fixer-windows.exe

          - os: ubuntu-latest
            executable: MR_DDS_fixer-linux

          - os: macos-latest
            executable: MR_DDS_fixer-macos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build executable
        run: pyinstaller --onefile --name "${{ matrix.executable }}" MR_DDS_fixer.py

      - name: Upload executable to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.executable }}
