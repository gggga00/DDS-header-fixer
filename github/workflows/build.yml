name: Build executables

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller --onefile --name MR_DDS_fixer-windows MR_DDS_fixer.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: MR_DDS_fixer-windows
          path: dist/MR_DDS_fixer-windows.exe


  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller --onefile --name MR_DDS_fixer-linux MR_DDS_fixer.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: MR_DDS_fixer-linux
          path: dist/MR_DDS_fixer-linux


  build-macos-intel:
    name: Build macOS Intel
    runs-on: macos-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller --onefile --name MR_DDS_fixer-x86_64 MR_DDS_fixer.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: MR_DDS_fixer-macos-x86_64
          path: dist/MR_DDS_fixer-x86_64


  build-macos-arm64:
    name: Build macOS Apple Silicon
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller --onefile --name MR_DDS_fixer-arm64 MR_DDS_fixer.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: MR_DDS_fixer-macos-arm64
          path: dist/MR_DDS_fixer-arm64


  create-macos-universal:
    name: Create macOS Universal
    needs:
      - build-macos-intel
      - build-macos-arm64
    runs-on: macos-14

    steps:
      - name: Download Intel build
        uses: actions/download-artifact@v4
        with:
          name: MR_DDS_fixer-macos-x86_64
          path: intel

      - name: Download Apple Silicon build
        uses: actions/download-artifact@v4
        with:
          name: MR_DDS_fixer-macos-arm64
          path: arm64

      - name: Create universal binary
        run: |
          lipo -create \
            intel/MR_DDS_fixer-x86_64 \
            arm64/MR_DDS_fixer-arm64 \
            -output MR_DDS_fixer-macos

      - name: Verify architectures
        run: |
          file MR_DDS_fixer-macos
          lipo -info MR_DDS_fixer-macos

      - name: Upload universal executable
        uses: actions/upload-artifact@v4
        with:
          name: MR_DDS_fixer-macos
          path: MR_DDS_fixer-macos


  release:
    name: Attach executables to release
    needs:
      - build-windows
      - build-linux
      - create-macos-universal
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: MR_DDS_fixer-windows
          path: release

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: MR_DDS_fixer-linux
          path: release

      - name: Download macOS Universal build
        uses: actions/download-artifact@v4
        with:
          name: MR_DDS_fixer-macos
          path: release

      - name: Attach executables to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/MR_DDS_fixer-windows.exe
            release/MR_DDS_fixer-linux
            release/MR_DDS_fixer-macos
